[project]
name = "transcribe"
version = "0.1.0"
description = "Fast audio transcription, speaker diarization, multi-model storage, and comparison engine"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "faster-whisper>=1.0.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "pyannote.audio>=3.1.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "scipy>=1.10.0",
    "soundfile>=0.12.0",
    "numpy>=1.24.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "websockets>=16.1.1",
    "jinja2>=3.1.6",
    "gdown>=6.1.0",
    "yt-dlp>=2026.8.19",
    "transformers>=5.16.1",
]

[project.scripts]
audio-transcribe = "transcribe.cli:main"
transcribe = "transcribe.cli:main"
audio-transcribe-server = "transcribe.server:start"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcribe"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "radon>=6.0.1",
]
